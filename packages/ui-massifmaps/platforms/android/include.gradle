repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }

	// A local AAR: -PmassifAar=<file name without .aar> and -PmassifAarDir=<folder holding it>
	// (or both as ext properties in before-plugins.gradle).
	if (project.hasProperty('massifAarDir')) {
		flatDir {
			dirs project.massifAarDir
		}
	}
}
dependencies {
    if (System.env.DEBUGMASSIF) {
        implementation project(path: ':massif')
    } else if (project.hasProperty('massifAar')) {
        implementation(name:project.massifAar, ext:'aar')

    } else {

	    def massifSDKVersion =  project.hasProperty("massifSDKVersion") ? project.massifSDKVersion : "6.2.1"
	    def massifSDKVariant =  project.hasProperty("massifSDKVariant") ? project.massifSDKVariant : "full"

        if (massifSDKVariant == "full") {
            implementation "com.github.massif-maps:MassifMaps-android-aar:$massifSDKVersion"
        } else {
            implementation "com.github.massif-maps:MassifMaps-android-aar:$massifSDKVersion:$massifSDKVariant@aar"
        }
    }
}
android {
    sourceSets {
        main {
            java {
                def massifSDKVariant =  project.hasProperty("massifSDKVariant") ? project.massifSDKVariant : "full"
                
                // The plugin's own Java listeners and callbacks extend SDK classes that only the
                // object API ships. A surface-only AAR (the default) has none of them: keep
                // SynchronousHandler and api/ - the surface API's listener - and drop the rest.
                def objectApi = massifSDKVariant.contains("objectapi") || project.hasProperty("massifObjectApi")
                if (!objectApi) {
                    exclude '**/additions/*Listener.java'
                    exclude '**/additions/ClusterElementBuilder.java'
                    exclude '**/additions/FeatureCollectionSearchServiceCallback.java'
                    exclude '**/additions/HillshadeRasterTileLayer.java'
                    exclude '**/additions/Utils.java'
                    exclude '**/additions2/**'
                    exclude '**/geocoding/**'
                    exclude '**/packagemanager/**'
                    exclude '**/routing/**'
                }

                // Exclude geocoding and routing if not using full variant
                if (massifSDKVariant != "full") {
                    exclude '**/geocoding/**'
                    exclude '**/packagemanager/**'
                    exclude '**/routing/**'
                }
				if (massifSDKVariant == "lite") {
                    exclude '**/additions2/**'
                }

                // The surface API's listener extends com.massifmaps.api.EventListener, which only
                // exists in an SDK built with all/native/api. Turn it off with -PmassifApi=false
                // when pinning an older SDK; the plugin's object API is unaffected.
                def massifApi = project.hasProperty("massifApi") ? project.massifApi.toString() : "true"
                if (massifApi == "false") {
                    exclude '**/nativescript/massifmaps/api/**'
                }
            }
        }
    }
}
